name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check shell syntax
        run: bash -n start.sh start_backend.sh start_frontend.sh scripts/start_options.sh
      - name: Compile Python sources
        run: python -m compileall -q backend scripts
      - name: Check JavaScript syntax
        run: node --check frontend/app.js
      - name: Verify public metadata
        run: test -f LICENSE -a -f NOTICE -a -f THIRD_PARTY_NOTICES.md -a -f SECURITY.md
